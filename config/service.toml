# 과제 8 상시 추론 서비스 설정 (specs/008-inference-service)

[data]
collector_db = "data/collector.db"   # 과제 1 수집기 DB (같은 보드)
collector_config = "config/collector.toml"
history_hours = 26                   # 매분 읽는 과거 길이 (예측 2시간, 이상 탐지 규칙, 하루 주기 여유)
stale_factor = 3                     # 센서 기대 간격의 이 배수 넘게 안 들어오면 '데이터 끊김'
stale_min_minutes = 5                # 1분 센서는 5분, 2분 센서는 6분, 10분 센서는 30분 넘게 조용하면 끊김
collector_silent_minutes = 5         # 모든 센서가 이만큼 조용하면 '수집 전체 끊김' (수집기 10분 정지 시험이 5분 안에 경보)
forecast_fresh_minutes = 15          # 최근 값이 이보다 오래되면 예측을 비운다 (10분 센서 + 10분 유지까지 허용)

[sensors]                            # 대시보드 '센서 실측' 탭 (/v1/sensors), 모델 계산과 따로
history_minutes = 180                # 작은 그래프에 보여 줄 최근 길이
bucket_minutes = 5
cache_seconds = 5                    # 이 시간 안의 요청은 DB를 다시 읽지 않는다 (화면에서 1초를 골라도 DB는 5초에 한 번)
event_profiles = ["WS301"]           # 사건이 있을 때만 보내는 센서 (끊김 판정 안 함)

[models]
dir = "data/models"                  # export로 만든 모델 (커밋 안 함). 보드 B에서 만들어 보드 A로 복사

[cycle]
seconds = 60
alert_repeat_minutes = 30            # 같은 경보는 상태가 바뀌거나 이 시간이 지나야 다시 보낸다

[mqtt]
enabled = true
topic_prefix = "aip/team5/jaeung/inference"   # <prefix>/<공간 slug>/state (retained), <prefix>/alerts, <prefix>/status
qos = 1

[http]
host = "0.0.0.0"                     # Tailscale 주소로 접근 (예: http://100.113.228.46:8080)
port = 8080

[monitor]
co2_mae_alert = 75                   # 최근 24시간 CO₂ 60분 예측 오차가 이보다 크면 forecast_drift 경보 (현재값 유지 시험 MAE 36 ppm의 약 2배)
