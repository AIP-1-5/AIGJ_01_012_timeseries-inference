<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육장 공기 상태</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* 디자인: 크림 · 코랄 시스템(cream-coral-pptx와 같은 값). 제목·큰 숫자는 세리프 400, 본문 Pretendard(없으면 Noto Sans KR).
     코랄은 "모델 예측" 한 가지 뜻으로만 쓴다. 그림자·그라데이션 없음, 깊이는 바탕 → 패널 → 다크 세 단계.
     구성(Taste 화면 규칙): 제목 아래 한 문장 결론 → 환기 순서(가장 큰 블록)·켜진 경보 → 공간별 상세 → 센서 표. 같은 숫자는 한 곳에만. */
  :root {
    --ground: #F5F0E8; --panel: #FAF9F5; --panel-line: #E6DFD8; --rule: #EBE6DF; --ink: #141413; --text: #3D3D3A; --muted: #6C6A64; --muted-soft: #8E8B82;
    --accent: #CC785C; --accent-soft: rgba(204,120,92,.18); --accent-text: #A9583E; --band: rgba(61,61,58,.10); --grid: #E6DFD8;
    --hit: #C64545; --good-text: #3D3D3A; --warn: #E8A55A; --warn-text: #8F5B12; --ok: #5DB872; --track: #E8E0D2;
    --btn: #181715; --on-btn: #FAF9F5; --tip: #181715; --on-tip: #FAF9F5;
    --dark: #181715; --on-dark: #FAF9F5; --on-dark-soft: #A09D96; --dark-rule: #2B2925;
    --f-title: "Noto Serif KR", "Nanum Myeongjo", serif; --f-body: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    --w-title: 400; --w-h2: 400; --w-fig: 400; --s-title: 32px; --t-title: -.02em; --t-h2: -.01em;
    --r-card: 12px; --r-btn: 8px; --r-track: 3px; --gap: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141311; --panel: #1E1D1A; --panel-line: #2E2C28; --rule: #2B2925; --ink: #FAF9F5; --text: #D9D5CC; --muted: #A09D96; --muted-soft: #8A867E;
      --accent-soft: rgba(204,120,92,.24); --accent-text: #DE8E73; --band: rgba(217,213,204,.12); --grid: #2E2C28;
      --hit: #E5806F; --good-text: #D9D5CC; --warn-text: #E8A55A; --track: #2E2B27;
      --btn: #FAF9F5; --on-btn: #181715; --tip: #FAF9F5; --on-tip: #181715; --dark: #0C0B0A; --dark-rule: #24221F;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #141311; --panel: #1E1D1A; --panel-line: #2E2C28; --rule: #2B2925; --ink: #FAF9F5; --text: #D9D5CC; --muted: #A09D96; --muted-soft: #8A867E;
    --accent-soft: rgba(204,120,92,.24); --accent-text: #DE8E73; --band: rgba(217,213,204,.12); --grid: #2E2C28;
    --hit: #E5806F; --good-text: #D9D5CC; --warn-text: #E8A55A; --track: #2E2B27;
    --btn: #FAF9F5; --on-btn: #181715; --tip: #FAF9F5; --on-tip: #181715; --dark: #0C0B0A; --dark-rule: #24221F;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ground); color: var(--text); }
  /* ===== 초안 공통 구조 (Taste 화면 규칙: 첫 블록이 화면의 질문에 답하고, 숫자는 한 곳에만) ===== */
  .draft { background: var(--ground); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.5; letter-spacing: var(--body-track, 0); }
  .draft .in { max-width: 1320px; margin: 0 auto; padding-block: 0 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
  .draft .num { font-variant-numeric: tabular-nums; }
  .shell { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 14px; border-bottom: 1px solid var(--rule); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
  .brand svg { width: 30px; height: 18px; flex-shrink: 0; }
  .brand b { font-size: 14px; font-weight: 600; }
  .brand span { font-size: 13px; color: var(--muted); }
  .stamp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .stamp .dot::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
  .btn { font: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: var(--r-btn); border: 0; background: var(--btn); color: var(--on-btn); cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .title h1 { margin: 0; font-family: var(--f-title); font-weight: var(--w-title); font-size: var(--s-title); line-height: 1.15; letter-spacing: var(--t-title); color: var(--ink); text-wrap: balance; }
  .title p { margin: 6px 0 0; font-size: 16px; color: var(--text); max-width: 72ch; }
  .title p b { color: var(--hit); font-weight: 600; }

  .main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--gap); align-items: stretch; }
  @media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--r-card); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel h2 { margin: 0; font-family: var(--f-title); font-weight: var(--w-h2); font-size: 18px; letter-spacing: var(--t-h2); color: var(--ink); }
  .panel .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .panel .ph span { font-size: 12px; color: var(--muted); }

  /* 환기 순서 */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 116px 92px 72px minmax(140px, 1fr) 118px; gap: 14px; align-items: center; padding: 11px 0; border-top: 1px solid var(--rule); }
  .row.head { border-top: 0; padding: 0 0 6px; font-size: 12px; color: var(--muted); }
  .row .r { text-align: right; }
  .row .nm { font-weight: 600; color: var(--ink); display: flex; flex-direction: column; }
  .row .nm small { font-weight: 400; font-size: 12px; color: var(--muted); }
  .row .nm small::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--lv); vertical-align: 1px; }
  .row .co2 { font-size: 22px; color: var(--ink); font-weight: var(--w-fig); line-height: 1.1; }
  .row .co2 small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .row .chg { font-size: 13px; }
  .bad-n { color: var(--hit); } .good-n { color: var(--good-text); } .flat-n { color: var(--muted); }
  .row .when { font-size: 13px; text-align: right; }
  .row .when b { color: var(--hit); font-weight: 600; }
  .row .when span { color: var(--muted); }
  .track { position: relative; height: 22px; }
  .track .base { position: absolute; left: 0; right: 0; top: 9px; height: 4px; background: var(--track); border-radius: var(--r-track); }
  .track .fill { position: absolute; left: 0; top: 9px; height: 4px; background: var(--ink); border-radius: var(--r-track); }
  .track .fc { position: absolute; top: 10px; height: 2px; background: var(--accent); }
  .track .fcm { position: absolute; top: 4px; width: 2px; height: 14px; background: var(--accent); }
  .track .lim { position: absolute; top: 2px; width: 1px; height: 18px; background: var(--hit); }
  .row.head .track { height: auto; }
  @media (max-width: 640px) {
    .row { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; }
    .row.head { display: none; }
    .row .co2 { grid-column: 2; grid-row: 1; text-align: right; }
    .row .chg { grid-column: 2; grid-row: 2; text-align: right; }
    .row .track { grid-column: 1 / -1; }
    .row .when { grid-column: 1 / -1; text-align: left; }
  }

  /* 경보 */
  .alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .alerts li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 14px; }
  .alerts li:first-child { border-top: 0; padding-top: 0; }
  .alerts .lv { font-size: 12px; font-weight: 600; }
  .alerts .lv.w { color: var(--warn-text); } .alerts .lv.i { color: var(--muted); }
  .alerts .sp { display: block; font-size: 12px; color: var(--muted); }

  /* 공간 상세 */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px 24px; }
  @media (max-width: 960px) { .detail { grid-template-columns: minmax(0, 1fr); } }
  .chart { position: relative; height: 250px; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .chart .tip { position: absolute; top: 30px; pointer-events: none; background: var(--tip); color: var(--on-tip); border-radius: var(--r-btn); font-size: 12px; padding: 7px 10px; white-space: nowrap; display: flex; flex-direction: column; gap: 1px; z-index: 2; font-variant-numeric: tabular-nums; }
  .chart .tip .t { opacity: .75; }
  .legend { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; vertical-align: middle; margin-right: 5px; }
  .legend i.ln { border-top: 2px solid var(--ink); } .legend i.rg { height: 8px; background: var(--band); }
  .legend i.fc { border-top: 2px dashed var(--accent); } .legend i.fr { height: 8px; background: var(--accent-soft); }
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--track); border-radius: var(--r-btn); }
  .seg button { font: inherit; font-size: 13px; padding: 3px 12px; border: 0; border-radius: var(--r-btn); background: transparent; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .kv div { display: flex; flex-direction: column; }
  .kv .k { font-size: 12px; color: var(--muted); }
  .kv .v { font-size: 24px; font-weight: var(--w-fig); color: var(--ink); line-height: 1.2; }
  .kv .v small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .kv .s { font-size: 12px; color: var(--muted); }
  .meter { display: flex; flex-direction: column; gap: 5px; }
  .meter .k { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .meter .k b { color: var(--ink); font-weight: 500; }
  .meter .t { position: relative; height: 6px; background: var(--track); border-radius: var(--r-track); }
  .meter .t i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: var(--r-track); }
  .meter .t i.w { background: var(--warn); }
  .meter .t s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
  .note { font-size: 12px; color: var(--muted); }

  .row .co2, .kv .v { font-family: var(--f-title); }
  .panel.dark { background: var(--dark); border-color: var(--dark); color: var(--on-dark); --ink: var(--on-dark); --text: var(--on-dark); --muted: var(--on-dark-soft); --rule: var(--dark-rule); --warn-text: #E8A55A; }
  .row { cursor: pointer; }
  .row:not(.head):hover .nm { text-decoration: underline; text-underline-offset: 3px; }
  .spaces { display: flex; flex-direction: column; gap: var(--gap); }
  .spaces > h2, .sensors > .ph h2 { margin: 8px 0 0; font-family: var(--f-title); font-weight: 400; font-size: 24px; color: var(--ink); letter-spacing: -.01em; }
  .panel.space { scroll-margin-top: 12px; }
  .panel.space .ph h2 { font-size: 22px; }
  .panel.space .ph .lvl { font-size: 13px; color: var(--muted); margin-left: 10px; font-family: var(--f-body); }
  .panel.space .ph .lvl::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lv); margin-right: 5px; vertical-align: 1px; }
  .panel.space.alerting { border-color: var(--warn); }
  .panel.space.critical { border-color: var(--hit); }
  .kv .v.big { font-size: 34px; }

  /* 센서 표: 선만 있는 표 */
  .sensors { display: flex; flex-direction: column; gap: 10px; }
  .sensors .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sensors .ph span { font-size: 13px; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 12px; font-weight: 400; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--muted); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: middle; color: var(--text); }
  td.r, th.r { text-align: right; }
  tr.group td { font-family: var(--f-title); font-size: 17px; color: var(--ink); padding: 18px 10px 6px; border-bottom: 1px solid var(--panel-line); }
  tr.group td span { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
  tr.stale td { color: var(--muted-soft); }
  tr.stale td.state { color: var(--hit); font-weight: 600; }
  td .id { display: block; font-size: 11px; color: var(--muted-soft); }
  .spark { width: 120px; height: 26px; display: block; }
  .bat { display: inline-flex; align-items: center; gap: 6px; }
  .bat .cell { width: 26px; height: 10px; border: 1.5px solid var(--muted); border-radius: 2px; position: relative; }
  .bat .cell::after { content: ""; position: absolute; right: -4px; top: 2px; width: 2px; height: 4px; background: var(--muted); }
  .bat .cell i { position: absolute; left: 1px; top: 1px; bottom: 1px; background: var(--muted); }
  .bat.low { color: var(--hit); font-weight: 600; } .bat.low .cell i { background: var(--hit); }
  @media (max-width: 640px) {
    table { min-width: 0; }
    thead { display: none; }
    tr:not(.group) { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
    tr:not(.group) td { border: 0; padding: 0; }
    tr:not(.group) td.c-name { grid-column: 1; }
    tr:not(.group) td.c-state { grid-column: 2; grid-row: 1; text-align: right; }
    tr:not(.group) td.c-vals { grid-column: 1 / -1; display: block; font-size: 13px; color: var(--muted); }
    tr:not(.group) td.c-hide { display: none; }
    tr.group { display: block; } tr.group td { display: block; }
  }
  td.c-vals { display: none; }
  footer { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--panel-line); padding-top: 14px; }
</style>
</head>
<body>

<div class="draft" id="draft"></div>

<script>
(() => {
  const MIN = 60000;
  const UNIT = { co2: "ppm", temperature: "℃", humidity: "%RH" };
  const LABEL = { co2: "CO₂", temperature: "온도", humidity: "습도" };
  const ORDER = ["lab", "office", "meeting", "office-out"];
  // ---------- 예시 데이터 (docs/interface.md §3.1·§4 형식) ----------
  function iso(t) { return new Date(t).toISOString().replace(/\.\d{3}Z$/, "Z"); }
  function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  function sample() {
    const now = Date.now();
    const slot = Math.floor(now / (5 * MIN)) * 5 * MIN;
    const start = slot - 180 * MIN;
    const n = 37;
    const r = rnd(42);
    const jitter = (a) => (r() - .5) * 2 * a;
    // 실습실: 수업 중 상승, 1시간 40분 전 쉬는 시간 환기로 떨어졌다가 다시 오름
    const labCo2 = i => { const m = i * 5; let v = m < 70 ? 560 + m * 3.6 : m < 85 ? 812 - (m - 70) * 14 : 602 + (m - 85) * 2.6; return v; };
    const series = (fn, a, dec = 0, every = 1) => Array.from({ length: n }, (_, i) => i % every ? null : +(fn(i) + jitter(a)).toFixed(dec));
    const fc = (now0, f) => Array.from({ length: 12 }, (_, k) => ({ minutes: (k + 1) * 5, value: +f((k + 1) * 5).toFixed(1) }));

    const sensors = {
      generated_at: iso(now),
      history: { start: iso(start), bucket_minutes: 5, buckets: n, metrics: ["co2", "temperature", "humidity"] },
      spaces: [
        { space: "실습실", slug: "lab", total: 5, stale: 1, sensors: [
          s("24e124707d1a0021", "AM107", "전방 오른쪽", now - 4 * MIN, { co2: 861, temperature: 23.4, humidity: 41.2, battery: 88, tvoc: 182, pressure: 1012.6, illumination: 412 },
            { co2: series(i => labCo2(i) + 12, 4, 0, 2), temperature: series(i => 22.1 + i * .035, .05, 1, 2), humidity: series(i => 39.5 + i * .05, .2, 1, 2) }),
          s("24e124707d1a0034", "AM107", "후면 오른쪽", now - .6 * MIN, { co2: 842, temperature: 23.1, humidity: 40.8, battery: 92, tvoc: 164, pressure: 1012.4, illumination: 388 },
            { co2: series(i => labCo2(i) - 8, 6), temperature: series(i => 21.9 + i * .034, .05, 1), humidity: series(i => 39.2 + i * .045, .2, 1) }),
          s("24e124136d2b7710", "EM500-CO2", "중앙", now - 1.4 * MIN, { co2: 855, temperature: 23.0, humidity: 41.0, battery: 76, pressure: 1012.5 },
            { co2: series(i => labCo2(i), 5, 0, 2), temperature: series(i => 21.8 + i * .035, .05, 1, 2), humidity: series(i => 39.4 + i * .045, .2, 1, 2) }),
          s("24e124710b3c4402", "AM103", "전방 왼쪽", now - 23 * MIN, { co2: 790, temperature: 22.6, humidity: 40.1, battery: 9 },
            { co2: series(i => i > 32 ? NaN : labCo2(i) - 15, 5), temperature: series(i => i > 32 ? NaN : 21.7 + i * .03, .05, 1), humidity: series(i => i > 32 ? NaN : 39 + i * .04, .2, 1) }),
          s("24e124785c389818", "EM320-TH", null, now - .3 * MIN, { temperature: 23.2, humidity: 41.4, battery: 95 },
            { temperature: series(i => 22 + i * .034, .05, 1), humidity: series(i => 39.6 + i * .05, .2, 1) }),
        ] },
        { space: "사무실", slug: "office", total: 2, stale: 0, sensors: [
          s("24e124710b3c5108", "AM103", "창가", now - .8 * MIN, { co2: 624, temperature: 24.1, humidity: 38.6, battery: 81 },
            { co2: series(i => 655 - i * .9 + Math.sin(i / 4) * 12, 6), temperature: series(i => 23.6 + i * .013, .05, 1), humidity: series(i => 37.9 + i * .02, .2, 1) }),
          s("24e124783a2f0911", "EM300-TH", "문 옆", now - .2 * MIN, { temperature: 24.4, humidity: 38.1, battery: 67 },
            { temperature: series(i => 23.9 + i * .013, .05, 1), humidity: series(i => 37.5 + i * .02, .2, 1) }),
        ] },
        { space: "회의실", slug: "meeting", total: 1, stale: 0, sensors: [
          s("24e124710b3c6620", "AM103", "테이블", now - 7 * MIN, { co2: 478, temperature: 22.2, humidity: 44.3, battery: 58 },
            { co2: series(i => i < 14 ? 720 - i * 12 : 552 - Math.min(i - 14, 12) * 6, 4, 0, 2), temperature: series(i => 22.9 - i * .02, .05, 1, 2), humidity: series(i => 45.1 - i * .02, .2, 1, 2) }),
        ] },
        { space: "사무실 밖", slug: "office-out", total: 1, stale: 0, sensors: [
          s("24e124783a2f1204", "EM300-TH", "복도", now - .5 * MIN, { temperature: 19.6, humidity: 52.4, battery: 73 },
            { temperature: series(i => 20.4 - i * .022, .06, 1), humidity: series(i => 51.2 + i * .033, .25, 1) }),
        ] },
      ],
    };
    function s(id, profile, spot, seen, metrics, history) {
      const m = {};
      for (const [k, v] of Object.entries(metrics)) m[k] = { value: v, unit: { co2: "ppm", temperature: "°C", humidity: "%", battery: "%", tvoc: "ppb", pressure: "hPa", illumination: "lux" }[k], at: iso(seen) };
      for (const k of Object.keys(history)) history[k] = history[k].map(v => Number.isNaN(v) ? null : v);
      const age = (now - seen) / MIN;
      const limit = Math.max((["24e124707d1a0021", "24e124710b3c6620"].includes(id) ? 10 : profile === "EM500-CO2" ? 2 : 1) * 3, 5);

    }

    const spaces = [
      { space: "실습실", slug: "lab", slot: iso(slot),

                    temperature: { now: 23.2, as_of: iso(slot), points: fc(23.2, m => 23.2 + m * .012) } },
        forecast_unavailable: null,

        rules: [],
        state: { occupied: true, occupied_probability: .93, ventilation_alert: true, ventilation_probability: .88, co2_over_limit_now: false },
        monitor: { co2: { mae_60: 41.8, n: 214 }, temperature: { mae_60: .31, n: 214 } },
        alerts: [
          { type: "co2_forecast", level: "warning", minutes: 55, message: "55분 뒤 CO₂ 1,000 ppm 초과 예상" },

          { type: "sensor_gap", level: "info", message: "센서 1대 끊김 (전방 왼쪽 AM103, 23분째). 나머지 센서로 계산 중" },
        ] },

        sensors: { total: 2, stale: [], last_seen: iso(now - .2 * MIN) },
        forecast: { co2: { now: 622, as_of: iso(slot), points: fc(622, m => 622 - m * .35) },
                    temperature: { now: 24.2, as_of: iso(slot), points: fc(24.2, m => 24.2 + m * .004) } },
        forecast_unavailable: null,
        anomaly: { score: .62, threshold: 2.31, is_anomaly: false, cause: null, by_metric: { co2: .55, temperature: .7, humidity: .6 } },
        rules: [],
        state: { occupied: true, occupied_probability: .71, ventilation_alert: false, ventilation_probability: .04, co2_over_limit_now: false },

                    temperature: { now: 22.2, as_of: iso(slot), points: fc(22.2, m => 22.2 - m * .003) } },
        forecast_unavailable: null,

        rules: [],
        state: { occupied: false, occupied_probability: .08, ventilation_alert: false, ventilation_probability: .01, co2_over_limit_now: false },
        monitor: { co2: { mae_60: 30.1, n: 198 }, temperature: { mae_60: .27, n: 198 } },
        alerts: [] },
      { space: "사무실 밖", slug: "office-out", slot: iso(slot),

        forecast: { temperature: { now: 19.6, as_of: iso(slot), points: fc(19.6, m => 19.6 - m * .006) } },
        forecast_unavailable: "CO₂ 센서 없음",
        anomaly: { score: .58, threshold: 2.31, is_anomaly: false, cause: null, by_metric: { co2: null, temperature: .6, humidity: .55 } },
        rules: [],

        alerts: [] },
    ];
    return { live: false, status: { status: "online", cycle_ms: 412 }, spaces: { spaces, stale: false }, sensors };
  }

  // ---------- 데이터 읽기: 보드의 서비스에서 열면 실데이터, 아니면 예시 ----------
  async function getJSON(path) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 4000);
    try {
      const res = await fetch(path, { signal: ctl.signal, cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      return await res.json();
    } finally { clearTimeout(t); }
  }
  const NO_SENSORS = { history: { start: new Date().toISOString(), bucket_minutes: 5, buckets: 36 }, spaces: [] };
  async function load() {
    if (location.protocol === "file:") return sample();   // 파일로 바로 열면 예시만
    // 서비스에서 열었는데 응답이 없으면 예시 데이터를 실데이터처럼 보이지 않고 "응답 대기"를 그린다
    const [spaces, sensors, health] = await Promise.allSettled([getJSON("/v1/spaces"), getJSON("/v1/sensors"), getJSON("/health")]);
    const sens = sensors.status === "fulfilled" && sensors.value?.history ? sensors.value : NO_SENSORS;
    if (spaces.status !== "fulfilled" || !Array.isArray(spaces.value?.spaces) || !spaces.value.spaces.length)
      return { live: true, waiting: true, status: { status: "offline" }, sensors: sens, spaces: { spaces: [] } };
    // /health: 200 ok, 503 stale(마지막 성공 주기가 오래됨)
    const st = health.status === "fulfilled" && health.value?.status === "ok" && !spaces.value.stale ? "online" : "degraded";
    return { live: true, status: { status: st }, spaces: spaces.value, sensors: sens };
  }

  // ---------- 도움 함수 ----------
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const kst = t => new Date(t).toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", hour12: false });
  const kstHour = t => +new Date(t).toLocaleString("en-US", { timeZone: "Asia/Seoul", hour: "numeric", hour12: false }) % 24;
  const fmt = (v, m) => v == null || Number.isNaN(v) ? "–" : m === "co2" ? Math.round(v).toLocaleString("ko-KR") : (+v).toFixed(1);
  function level(c) {
    if (c == null) return { word: "CO₂ 센서 없음", dot: "var(--muted)" };
    if (c > 1000) return { word: "환기 필요", dot: "var(--hit)" };
    if (c > 800) return { word: "보통", dot: "var(--warn)" };
    return { word: "좋음", dot: "var(--ok)" };
  }
  // 예측이 처음 1,000 ppm 이상인 시점(분). 서비스 경보(co2_forecast.minutes)와 같은 규칙이라 문장·표·그래프·경보가 같은 값을 쓴다
  function crossMin(c) {
    if (!c || c.now >= 1000) return null;
    const p = c.points.find(q => q.value >= 1000);
    return p ? p.minutes : null;
  }
  const pos = v => Math.max(0, Math.min(100, (v - 400) / 1100 * 100));

  function filled(arr) {
    const out = arr.slice(); let last = null, gap = 0;
    for (let i = 0; i < out.length; i++) {
      if (out[i] != null) { last = out[i]; gap = 0; } else if (last != null && ++gap <= 2 && arr.slice(i + 1).some(v => v != null)) out[i] = last;
    }
    return out;
  }
  function aggregate(ss, m) {
    const n = DATA.sensors.history.buckets;
    const per = (ss?.sensors || []).map(d => d.history?.[m]).filter(Boolean).map(filled);
    return Array.from({ length: n }, (_, i) => {
      const vs = per.map(a => a[i]).filter(v => v != null);
      return vs.length ? { avg: vs.reduce((a, b) => a + b) / vs.length, min: Math.min(...vs), max: Math.max(...vs), n: vs.length } : null;
    });
  }
  const bucketTime = i => Date.parse(DATA.sensors.history.start) + (i + .5) * DATA.sensors.history.bucket_minutes * MIN;
  function change30(agg) {
    let last = -1; for (let i = agg.length - 1; i >= 0; i--) if (agg[i]) { last = i; break; }
    const prev = last >= 6 ? agg[last - 6] || agg[last - 5] || agg[last - 7] : null;
    return prev ? agg[last].avg - prev.avg : null;
  }
  const lastAvg = agg => { for (let i = agg.length - 1; i >= 0; i--) if (agg[i]) return agg[i].avg; return null; };
  const sensorsOf = sp => DATA.sensors.spaces.find(s => s.slug === sp.slug);
  // CO₂는 오르면 나쁨, 내리면 좋음. 변화가 작으면 회색
  function chg(d, m) {
    if (d == null) return `<span class="flat-n">–</span>`;
    const flat = Math.abs(d) < (m === "co2" ? 10 : .2);
    const cls = flat ? "flat-n" : m === "co2" ? (d > 0 ? "bad-n" : "good-n") : "flat-n";
    return `<span class="${cls}">${d > 0 ? "+" : d < 0 ? "−" : "±"}${fmt(Math.abs(d), m)}</span>`;
  }

  // ---------- 그래프: 실측 평균 + 센서 범위, 예측 + 예측 범위, 주석은 그래프 위 한 줄에 ----------
  function drawChart(box, sp, m) {
    const W = Math.max(box.clientWidth, 260), H = box.clientHeight || 250;
    const narrow = W < 460;
    const agg = aggregate(sensorsOf(sp), m);
    const past = agg.map((a, i) => a && { t: bucketTime(i), ...a }).filter(Boolean);
    const fc = sp.forecast?.[m], slot = Date.parse(sp.slot), mae = sp.monitor?.[m]?.mae_60;
    const half = k => mae == null ? 0 : mae * Math.sqrt(k / 60);
    const fp = fc ? [{ t: slot, v: fc.now, k: 0, lo: fc.now, hi: fc.now }, ...fc.points.map(p => ({ t: slot + p.minutes * MIN, v: p.value, k: p.minutes, lo: p.value - half(p.minutes), hi: p.value + half(p.minutes) }))] : [];
    const t0 = Date.parse(DATA.sensors.history.start), t1 = slot + 60 * MIN;

    // 주석: 15분 사이 가장 큰 변화(평소 변화의 3배 넘을 때)와 1,000 ppm 도달 예상
    const notes = [];
    if (past.length > 4) {
      const steps = past.slice(1).map((p, i) => Math.abs(p.avg - past[i].avg)).sort((a, b) => a - b);
      const usual = steps[Math.floor(steps.length / 2)] || 1;
      let best = null;
      for (let i = 3; i < past.length; i++) { const d = past[i].avg - past[i - 3].avg; if (!best || Math.abs(d) > Math.abs(best.d)) best = { i, d }; }
      if (best && Math.abs(best.d) > usual * 9) notes.push({ t: past[best.i].t, v: past[best.i].avg, text: `${best.d < 0 ? "−" : "+"}${fmt(Math.abs(best.d), m)} ${UNIT[m]} (15분, ${kst(past[best.i - 3].t)}~${kst(past[best.i].t)})`, short: `${best.d < 0 ? "−" : "+"}${fmt(Math.abs(best.d), m)}` });
    }
    const cm = m === "co2" ? crossMin(fc) : null;
    const cross = cm != null ? { t: slot + cm * MIN, v: fp.find(p => p.k === cm).v } : null;
    if (cross) notes.push({ t: cross.t, v: 1000, text: `${kst(cross.t)} 1,000 ppm 도달 예상`, short: `${kst(cross.t)} 도달`, hit: true });

    const pad = { l: 44, r: narrow ? 12 : 56, t: notes.length ? 34 : 12, b: 24 };
    const vals = [...past.flatMap(p => [p.min, p.max]), ...fp.flatMap(p => [p.lo, p.hi])];
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (m === "co2") { lo = Math.min(lo, 400); hi = Math.max(hi, 1000); }
    const span = hi - lo;
    const step = m === "co2" ? 200 : span > 8 ? 2 : span > 3 ? 1 : .5;
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil((hi + (m === "co2" ? 1 : step * .2)) / step) * step;
    const x = t => pad.l + (t - t0) / (t1 - t0) * (W - pad.l - pad.r);
    const y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
    const X0 = pad.l, X1 = W - pad.r, Y0 = pad.t, Y1 = H - pad.b;
    const path = (pts, k) => pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
    const band = (pts, a, b) => path(pts, a) + pts.slice().reverse().map(p => `L${x(p.t).toFixed(1)},${y(p[b]).toFixed(1)}`).join("") + "Z";
    let g = "";
    for (let v = lo; v <= hi + 1e-9; v += step) {
      if (v > lo) g += `<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`;
      g += `<text x="${X0 - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${m === "co2" ? v.toLocaleString("ko-KR") : v.toFixed(step < 1 ? 1 : 0)}</text>`;
    }
    g += `<line x1="${X0}" x2="${X1}" y1="${Y1}" y2="${Y1}" stroke="var(--muted)" stroke-width="1"/>`;
    for (let t = Math.ceil(t0 / (60 * MIN)) * 60 * MIN; t <= t1; t += 60 * MIN)
      if (Math.abs(x(t) - x(slot)) > 30) g += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${String(kstHour(t)).padStart(2, "0")}:00</text>`;
    g += `<line x1="${x(slot)}" x2="${x(slot)}" y1="${Y0}" y2="${Y1}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
    g += `<text x="${x(slot)}" y="${H - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">지금</text>`;
    if (m === "co2") {
      g += `<line x1="${X0}" x2="${X1}" y1="${y(1000)}" y2="${y(1000)}" stroke="var(--hit)" stroke-dasharray="4 3"/>`;
      g += `<text x="${X0 + 6}" y="${y(1000) - 5}" font-size="11" fill="var(--hit)">1,000 ppm</text>`;
    }
    const runs = []; let run = [];
    past.forEach((p, i) => { if (i && p.t - past[i - 1].t > 15 * MIN) { runs.push(run); run = []; } run.push(p); });
    if (run.length) runs.push(run);
    for (const r of runs) {
      if (r.some(p => p.n > 1)) g += `<path d="${band(r, "max", "min")}" fill="var(--band)"/>`;
      g += `<path d="${path(r, "avg")}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
    }
    if (fp.length) {
      if (mae != null) g += `<path d="${band(fp, "hi", "lo")}" fill="var(--accent-soft)"/>`;
      g += `<path d="${path(fp, "v")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-dasharray="6 4"/>`;
      const e = fp.at(-1);
      if (!narrow) g += `<text x="${x(e.t) + 6}" y="${y(e.v) + 4}" font-size="12" font-weight="600" fill="var(--accent-text)">${fmt(e.v, m)}</text>`;
    }
    // 주석 줄: 그래프 위에 라벨, 점까지 지시선. 겹치면 짧은 글로
    let right = -Infinity;
    notes.sort((a, b) => a.t - b.t).forEach(n => {
      const nx = x(n.t), label = narrow ? n.short : n.text, w = label.length * 6.4;
      let lx = Math.max(X0, Math.min(X1 - w, nx - w / 2));
      const txt = lx < right + 8 ? n.short : label;
      if (lx < right + 8) lx = Math.max(right + 8, nx - txt.length * 3.2);
      right = lx + txt.length * 6.4;
      g += `<line x1="${nx}" x2="${nx}" y1="${14}" y2="${y(n.v) - 4}" stroke="${n.hit ? "var(--hit)" : "var(--muted)"}" stroke-width="1"/>`;
      g += `<circle cx="${nx}" cy="${y(n.v)}" r="3.5" fill="var(--panel)" stroke="${n.hit ? "var(--hit)" : "var(--ink)"}" stroke-width="1.5"/>`;
      g += `<text x="${lx}" y="10" font-size="11.5" font-weight="${n.hit ? 600 : 400}" fill="${n.hit ? "var(--hit)" : "var(--text)"}">${txt}</text>`;
    });
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.space)} ${LABEL[m]} 최근 3시간 실측과 60분 예측">${g}<g class="hv" opacity="0"><line class="vl" y1="${Y0}" y2="${Y1}" stroke="var(--ink)" opacity=".3"/><circle class="dt" r="4"/></g></svg><div class="tip" hidden></div>`;
    const pts = [...past.map(p => ({ ...p, v: p.avg })), ...fp.slice(1).map(p => ({ ...p, f: true }))];
    const svg = box.querySelector("svg"), tip = box.querySelector(".tip"), hv = svg.querySelector(".hv");
    const hide = () => { tip.hidden = true; hv.setAttribute("opacity", 0); };
    const move = ev => {
      const rc = svg.getBoundingClientRect(), px = (ev.clientX - rc.left) * W / rc.width;
      if (px < X0 - 10 || px > X1 + 10) return hide();
      let b = null, bd = Infinity; for (const p of pts) { const d = Math.abs(x(p.t) - px); if (d < bd) { bd = d; b = p; } }
      if (!b) return hide();
      hv.setAttribute("opacity", 1);
      hv.querySelector(".vl").setAttribute("x1", x(b.t)); hv.querySelector(".vl").setAttribute("x2", x(b.t));
      const dt = hv.querySelector(".dt"); dt.setAttribute("cx", x(b.t)); dt.setAttribute("cy", y(b.v)); dt.setAttribute("fill", b.f ? "var(--accent)" : "var(--ink)");
      tip.innerHTML = b.f ? `<span class="t">${kst(b.t)} · ${b.k}분 뒤 예측</span><span>${fmt(b.v, m)} ${UNIT[m]}${mae != null ? ` (${fmt(b.lo, m)}~${fmt(b.hi, m)})` : ""}</span>`
        : `<span class="t">${kst(b.t - 2.5 * MIN)}~${kst(b.t + 2.5 * MIN)} 실측</span><span>평균 ${fmt(b.avg, m)} ${UNIT[m]}</span>${b.n > 1 ? `<span>센서 ${b.n}대 ${fmt(b.min, m)}~${fmt(b.max, m)}</span>` : ""}`;
      tip.hidden = false;
      const tw = tip.offsetWidth, bx = x(b.t) / W * rc.width;
      tip.style.left = `${Math.max(0, Math.min(rc.width - tw, bx < rc.width / 2 ? bx + 12 : bx - tw - 12))}px`;
    };
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move); svg.addEventListener("pointerleave", hide);
    return { legend: `<span><i class="ln"></i>실측 평균</span>${past.some(p => p.n > 1) ? `<span><i class="rg"></i>센서 범위</span>` : ""}${fc ? `<span><i class="fc"></i>예측</span>${mae != null ? `<span><i class="fr"></i>예측 범위</span>` : ""}` : ""}` };
  }

  // 센서 표의 3시간 미니 그래프 (표 안에서만 쓴다)
  function spark(values, limit, stale) {
    const W = 120, H = 26, p = 3, vs = values.filter(v => v != null);
    if (vs.length < 2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"></svg>`;
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (limit != null) { lo = Math.min(lo, 400); hi = Math.max(hi, limit); }
    if (hi - lo < (limit != null ? 80 : 1)) { const c = (hi + lo) / 2, s = limit != null ? 40 : .5; lo = c - s; hi = c + s; }
    const x = i => p + i / (values.length - 1) * (W - 2 * p), y = v => p + (1 - (v - lo) / (hi - lo)) * (H - 2 * p);
    let d = "", on = false;
    values.forEach((v, i) => { if (v == null) { on = false; return; } d += `${on ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; on = true; });
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${limit != null && limit <= hi ? `<line x1="${p}" x2="${W - p}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--hit)" stroke-dasharray="2 3"/>` : ""}<path d="${d}" fill="none" stroke="${stale ? "var(--muted-soft)" : "var(--ink)"}" stroke-width="1.5"/></svg>`;
  }

  // ---------- 화면 그리기 ----------
  let DATA, loadedAt = Date.now();
  const metricOf = {};
  try { Object.assign(metricOf, JSON.parse(localStorage.getItem("air-metric") || "{}")); } catch (e) { /* 저장소 없음 */ }

  function render() {
    const root = $("draft");
    if (DATA.waiting) {
      root.innerHTML = `<div class="in">
        <div class="title" id="top"><h1>교육장 공기 상태</h1><p>추론 서비스가 아직 결과를 내지 않았습니다(첫 계산 전이거나 멈춤). 30초마다 다시 읽습니다.</p></div>
        <section class="panel" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px"><div class="note">확인: <a style="color:inherit" href="/health">/health</a> · <a style="color:inherit" href="/v1/spaces">/v1/spaces</a> · <a style="color:inherit" href="/v1/sensors">/v1/sensors</a></div>
        <button type="button" class="btn" id="reload" style="width:auto">다시 읽기</button></section></div>`;
      return;
    }
    const all = DATA.spaces.spaces;
    const spaces = ORDER.map(s => all.find(x => x.slug === s)).filter(Boolean).concat(all.filter(x => !ORDER.includes(x.slug)));
    const slot = Date.parse(DATA.spaces.slot || spaces[0].slot);
    const rank = spaces.map(sp => {
      const c = sp.forecast?.co2, cm = crossMin(c);
      return { sp, c, at: cm, over: !!(c && c.now > 1000) };
    }).sort((a, b) => (b.over - a.over) || ((a.at ?? 999) - (b.at ?? 999)) || ((b.c?.now ?? -1) - (a.c?.now ?? -1)));
    const top = rank[0];
    const finding = top.over ? `<b>${esc(top.sp.space)}</b> CO₂가 이미 1,000 ppm을 넘었습니다. 지금 환기하세요.`
      : top.at != null ? `<b>${esc(top.sp.space)}</b> CO₂가 약 ${top.at}분 뒤(${kst(slot + top.at * MIN)}) 1,000 ppm을 넘을 것으로 보입니다. 다음 쉬는 시간에 환기하세요.`
      : `1시간 안에 1,000 ppm을 넘을 공간이 없습니다.`;
    const alerts = spaces.flatMap(sp => (sp.alerts || []).map(a => ({ ...a, sp }))).sort((a, b) => (a.level === "warning" ? 0 : 1) - (b.level === "warning" ? 0 : 1));
    const st = DATA.status.status;
    const svc = { online: "서비스 정상", degraded: "계산 실패 중", offline: "서비스 꺼짐" }[st] || st;
    const okColor = st === "online" ? "var(--ok)" : st === "degraded" ? "var(--warn)" : "var(--hit)";
    let total = 0, stale = 0;
    for (const g of DATA.sensors.spaces || []) for (const d of g.sensors || []) { total++; if (d.stale) stale++; }

    root.innerHTML = `<div class="in">
      <div class="shell">
        <a class="brand" href="#top" aria-label="팀5 공기 서비스">
          <svg viewBox="0 0 30 18" aria-hidden="true"><circle cx="5" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="9" r="4.5" fill="currentColor"/><circle cx="25" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="9" x2="10.5" y1="7.5" y2="7.5" stroke="currentColor" stroke-width="1.5"/><line x1="9" x2="10.5" y1="10.5" y2="10.5" stroke="currentColor" stroke-width="1.5"/><line x1="19.5" x2="21" y1="7.5" y2="7.5" stroke="currentColor" stroke-width="1.5"/><line x1="19.5" x2="21" y1="10.5" y2="10.5" stroke="currentColor" stroke-width="1.5"/></svg>
          <b>팀5 공기 서비스</b><span>보드 A · 교육장 4곳</span></a>
        <div class="stamp"><span class="dot" style="--ok:${okColor}">${esc(svc)}</span><span>${kst(slot)} 기준 · ${DATA.live ? "실시간" : "예시 데이터"} · <span id="ago">방금</span> 읽음</span><button type="button" class="btn" id="reload">다시 읽기</button></div>
      </div>
      <div class="title" id="top"><h1>교육장 공기 상태</h1><p>${finding}</p></div>
      <div class="main">
        <section class="panel" aria-labelledby="t-rank">
          <div class="ph"><h2 id="t-rank">환기 순서</h2><span>1,000 ppm에 먼저 닿는 공간부터 · 누르면 상세로</span></div>
          <div class="rows">
            <div class="row head"><span>공간</span><span class="r">CO₂ 지금</span><span class="r">30분 변화</span><span>400~1,500 ppm · 막대 끝 지금, 색 눈금 60분 뒤, 세로선 1,000</span><span class="r">1,000 ppm</span></div>
            ${rank.map(({ sp, c, at, over }) => {
              const lv = level(c?.now ?? null), c60 = c?.points.at(-1)?.value;
              return `<div class="row" data-go="${esc(sp.slug)}" role="link" tabindex="0" style="--lv:${lv.dot}">
                <span class="nm">${esc(sp.space)}<small>${lv.word}${sp.state ? (sp.state.occupied ? " · 사용 중" : " · 비어 있음") : ""}</small></span>
                <span class="co2 r num">${c ? `${fmt(c.now, "co2")}<small>ppm</small>` : "–"}</span>
                <span class="chg r num">${c ? chg(change30(aggregate(sensorsOf(sp), "co2")), "co2") : `<span class="flat-n">–</span>`}</span>
                ${c ? `<span class="track" title="지금 ${fmt(c.now, "co2")} · 60분 뒤 ${fmt(c60, "co2")} ppm"><i class="base"></i><i class="fill" style="width:${pos(c.now)}%"></i>
                  <i class="fc" style="left:${Math.min(pos(c.now), pos(c60))}%;width:${Math.abs(pos(c60) - pos(c.now))}%"></i><i class="fcm" style="left:calc(${pos(c60)}% - 1px)"></i><i class="lim" style="left:${pos(1000)}%"></i></span>`
                  : `<span class="note">온도 ${fmt(sp.forecast?.temperature?.now, "temperature")} ℃ · ${esc(sp.forecast_unavailable || "CO₂ 값 없음")}</span>`}
                <span class="when num">${over ? `<b>이미 넘음</b>` : at != null ? `<b>${at}분 뒤 · ${kst(slot + at * MIN)}</b>` : c ? `<span>1시간 안 없음</span>` : `<span>–</span>`}</span>
              </div>`;
            }).join("")}
          </div>
        </section>
        <section class="panel dark" aria-labelledby="t-alerts">
          <div class="ph"><h2 id="t-alerts">켜진 경보</h2><span>경고 ${alerts.filter(a => a.level === "warning").length}건 · 끊긴 센서 ${stale}대</span></div>
          <ul class="alerts">${alerts.map(a => `<li><span class="lv ${a.level === "warning" ? "w" : "i"}">${a.level === "warning" ? "경고" : "알림"}</span><span>${esc(a.message)}<span class="sp">${esc(a.sp.space)}</span></span></li>`).join("") || `<li><span></span><span>켜진 경보가 없습니다.</span></li>`}</ul>
        </section>
      </div>

      <div class="spaces">
        <h2>공간별 3시간 실측과 60분 예측</h2>
        ${spaces.map(sp => {
          const c = sp.forecast?.co2, tmp = sp.forecast?.temperature, ss = sensorsOf(sp);
          const hum = lastAvg(aggregate(ss, "humidity"));
          const lv = level(c?.now ?? null);
          const tabs = (c ? ["co2"] : []).concat(["temperature", "humidity"]);
          const m = tabs.includes(metricOf[sp.slug]) ? metricOf[sp.slug] : tabs[0];
          const mon = sp.monitor?.[m];
          const st2 = sp.state?.ventilation_probability != null ? sp.state : null, an = sp.anomaly?.score != null && sp.anomaly?.threshold != null ? sp.anomaly : null, anMax = an ? Math.max(an.threshold * 1.6, an.score * 1.1) : 1;
          const warn = (sp.alerts || []).some(a => a.level === "warning");
          const mainMon = [sp.monitor?.co2, sp.monitor?.temperature].find(x => x?.mae_60 != null);
          return `<section class="panel space ${c && c.now > 1000 ? "critical" : warn ? "alerting" : ""}" id="${esc(sp.slug)}" aria-labelledby="h-${esc(sp.slug)}" style="--lv:${lv.dot}">
            <div class="ph"><h2 id="h-${esc(sp.slug)}">${esc(sp.space)}<span class="lvl">${lv.word}</span></h2>
              <div class="seg" role="group" aria-label="${esc(sp.space)} 그래프 항목">${tabs.map(k => `<button type="button" id="m-${esc(sp.slug)}-${k}" data-slug="${esc(sp.slug)}" data-m="${k}" aria-pressed="${m === k}">${LABEL[k]}</button>`).join("")}</div></div>
            <div class="detail">
              <div><div class="legend" data-legend></div><div class="chart" data-slug="${esc(sp.slug)}" data-m="${m}"></div>
                <div class="note">${m === "humidity" ? "습도는 모델이 예측하지 않아 실측만 그립니다." : mon?.mae_60 != null ? `예측 범위: 지난 24시간 60분 예측 오차(${mon.mae_60.toFixed(m === "co2" ? 0 : 2)} ${UNIT[m]})로, 가까운 시점일수록 좁게.` : ""}</div></div>
              <div class="side">
                <div class="kv">
                  <div><span class="k">온도</span><span class="v num">${fmt(tmp?.now, "temperature")}<small>℃</small></span><span class="s">60분 뒤 ${fmt(tmp?.points.at(-1)?.value, "temperature")}</span></div>
                  <div><span class="k">습도</span><span class="v num">${fmt(hum, "humidity")}<small>%RH</small></span><span class="s">센서 평균</span></div>
                </div>
                ${st2 ? `<div class="meter"><span class="k"><span>30분 안 환기 필요</span><b class="num">${Math.round(st2.ventilation_probability * 100)}%</b></span><span class="t"><i class="${st2.ventilation_probability >= .5 ? "w" : ""}" style="width:${st2.ventilation_probability * 100}%"></i></span></div>
                <div class="meter"><span class="k"><span>사용 중</span><b class="num">${Math.round(st2.occupied_probability * 100)}%</b></span><span class="t"><i style="width:${st2.occupied_probability * 100}%"></i></span></div>` : `<div class="note">CO₂ 센서가 없어 사용 여부와 환기 판단을 하지 않습니다.</div>`}
                ${an ? `<div class="meter"><span class="k"><span>이상 점수 (기준 ${an.threshold.toFixed(2)})</span><b class="num">${an.score.toFixed(2)}</b></span><span class="t"><i class="${an.is_anomaly ? "w" : ""}" style="width:${an.score / anMax * 100}%"></i><s style="left:${an.threshold / anMax * 100}%"></s></span></div>` : ""}
                <div class="note">${sp.sensors ? `센서 ${sp.sensors.total - (sp.sensors.stale || []).length}/${sp.sensors.total}대 수신${sp.sensors.last_seen ? ` · 마지막 ${kst(sp.sensors.last_seen)}` : ""}` : ""}${mainMon ? ` · 60분 예측 오차 ${mainMon === sp.monitor?.co2 ? Math.round(mainMon.mae_60) + " ppm" : mainMon.mae_60.toFixed(2) + " ℃"} (최근 ${mainMon.n}건)` : ""}</div>
              </div>
            </div>
          </section>`;
        }).join("")}
      </div>

      <section class="sensors" id="sensors" aria-labelledby="t-sensors">
        <div class="ph"><h2 id="t-sensors">센서별 실측값</h2><span>센서 ${total}대 중 ${total - stale}대 정상${stale ? `, ${stale}대 끊김` : ""}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>위치</th><th>기종</th><th class="r">CO₂ ppm</th><th class="r">온도 ℃</th><th class="r">습도 %RH</th><th>최근 3시간</th><th>배터리</th><th class="r">마지막 수신</th><th>상태</th></tr></thead>
          <tbody>${(DATA.sensors.spaces || []).map(g => `<tr class="group"><td colspan="9">${esc(g.space)} <span>${g.total}대${g.stale ? `, 끊김 ${g.stale}` : ""}</span></td></tr>` + (g.sensors || []).map(d => {
            const mm = d.metrics || {}, bat = mm.battery?.value, sm = d.history?.co2 ? "co2" : "temperature";
            const age = d.age_minutes == null ? "–" : d.age_minutes < 1 ? "1분 안" : `${Math.round(d.age_minutes)}분 전`;
            const extras = Object.entries(mm).filter(([k]) => !["co2", "temperature", "humidity", "battery"].includes(k)).map(([k, v]) => `${k} ${v.value}${v.unit ? " " + v.unit : ""}`).join(" · ");
            return `<tr class="${d.stale ? "stale" : ""}">
              <td class="c-name">${d.spot ? esc(d.spot) : `<span style="color:var(--muted)">위치 표시 없음</span>`}<span class="id">${esc(d.profile)} · ${esc(d.device_id)}</span></td>
              <td class="c-hide"><span title="${esc(extras)}">${esc(d.profile)}</span></td>
              <td class="r c-hide">${fmt(mm.co2?.value, "co2")}</td>
              <td class="r c-hide">${fmt(mm.temperature?.value, "temperature")}</td>
              <td class="r c-hide">${fmt(mm.humidity?.value, "humidity")}</td>
              <td class="c-hide" title="${LABEL[sm]} 최근 3시간">${spark(filled(d.history?.[sm] || []), sm === "co2" ? 1000 : null, d.stale)}</td>
              <td class="c-hide">${bat == null ? "–" : `<span class="bat ${bat < 15 ? "low" : ""}"><span class="cell"><i style="width:${Math.max(2, bat * .22)}px"></i></span>${Math.round(bat)}%</span>`}</td>
              <td class="r c-hide">${d.last_seen ? kst(d.last_seen) : "–"} <span style="color:var(--muted)">(${age})</span></td>
              <td class="state c-state">${d.kind === "event" ? "사건 센서" : d.stale ? "끊김" : "정상"}</td>
              <td class="c-vals">${[mm.co2 && `CO₂ ${fmt(mm.co2.value, "co2")}`, mm.temperature && `${fmt(mm.temperature.value, "temperature")} ℃`, mm.humidity && `${fmt(mm.humidity.value, "humidity")} %RH`, bat != null && `배터리 ${Math.round(bat)}%`, age].filter(Boolean).join(" · ")}</td></tr>`;
          }).join("")).join("")}</tbody></table></div>
      </section>

      <footer>
        <span>${DATA.live ? "출처: 보드 A 추론 서비스 (/v1/spaces, /v1/sensors). 30초마다 다시 읽습니다." : "출처: 예시 데이터 (docs/interface.md 형식). 보드 A 서비스 주소에서 이 파일을 열면 실데이터로 바뀝니다."}</span>
        <span>CO₂ 상태: 800 ppm 이하 좋음, 800~1,000 보통, 1,000 초과 환기 필요. 그래프의 회색 띠는 같은 공간 센서들의 최저~최고값, 코랄 점선과 띠는 60분 예측과 예측 범위입니다. 시각은 한국 시각(KST).</span>
      </footer>
    </div>`;
    drawCharts();
  }

  function drawCharts() {
    for (const box of document.querySelectorAll(".chart")) {
      const sp = DATA.spaces.spaces.find(s => s.slug === box.dataset.slug);
      if (!sp) continue;
      const r = drawChart(box, sp, box.dataset.m);
      box.parentElement.querySelector("[data-legend]").innerHTML = r.legend;
    }
  }

  document.addEventListener("click", ev => {
    const s = ev.target.closest(".seg button");
    if (s) {
      metricOf[s.dataset.slug] = s.dataset.m;
      try { localStorage.setItem("air-metric", JSON.stringify(metricOf)); } catch (e) { /* 저장 못 해도 동작 */ }
      const y = scrollY; render(); scrollTo(0, y); return;
    }
    const row = ev.target.closest(".row[data-go]");
    if (row) { document.getElementById(row.dataset.go)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
    if (ev.target.id === "reload") refresh();
  });
  document.addEventListener("keydown", ev => {
    const row = ev.target.closest?.(".row[data-go]");
    if (row && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); document.getElementById(row.dataset.go)?.scrollIntoView(); }
  });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => DATA && drawCharts(), 150); });
  setInterval(() => { const el = $("ago"); if (!el) return; const s = Math.round((Date.now() - loadedAt) / 1000); el.textContent = s < 10 ? "방금" : s < 60 ? `${s}초 전` : `${Math.floor(s / 60)}분 전`; }, 1000);

  let timer;
  async function refresh() {
    clearTimeout(timer);
    DATA = await load(); loadedAt = Date.now();
    const y = scrollY; render(); scrollTo(0, y);
    if (DATA.live) timer = setTimeout(refresh, 30000);   // 응답 대기 화면도 30초마다 다시 시도
  }
  refresh();
})();
</script>
</body>
</html>
